# Publishes the demo to GitHub Pages on every push to main, after the tests:
# https://tabrigos.github.io/kanshi/ shows what is on the main branch.
# The site keeps the repository layout (demo/ next to src/), so the demo's
# ../src/*.css links work unchanged; the root only redirects to the demo.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r demo src _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Kanshi</title>
          <meta http-equiv="refresh" content="0; url=demo/">
          <a href="demo/">Kanshi demo</a>
          HTML
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
